<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Alert</title>

<style>
body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 70px;
}

.box {
    width: 85%;
    max-width: 450px;
    margin: auto;
    padding: 25px;
    border: 2px solid red;
    border-radius: 15px;
    box-shadow: 0 0 25px red;
}

h1 {
    color: red;
    font-size: 34px;
    animation: blink 0.8s infinite;
}

#status {
    font-size: 22px;
    margin: 25px 0;
}

.loader {
    width: 100%;
    height: 18px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
}

#bar {
    width: 0%;
    height: 18px;
    background: red;
    border-radius: 10px;
    transition: width 0.3s;
}

#percent {
    font-size: 28px;
}

@keyframes blink {
    50% {
        opacity: 0.4;
    }
}
</style>
</head>

<body>

<div class="box">

<h1>🚨 ACCOUNT ALERT 🚨</h1>

<h2>Finish Your Account Balance</h2>

<p>🔓 Crack Your Account</p>

<div id="status">Scanning account...</div>

<div class="loader">
    <div id="bar"></div>
</div>

<h2 id="percent">0%</h2>

</div>

<script>

let progress = 0;

let scan = setInterval(function() {

    progress += 5;

    document.getElementById("bar").style.width = progress + "%";
    document.getElementById("percent").innerHTML = progress + "%";

    if (progress >= 100) {

        clearInterval(scan);

        document.getElementById("status").innerHTML =
        "⚠️ ACCESS DETECTED";

    }

}, 300);

</script>

</body>
</html>
